name: Daily Augt generation

on:
  schedule:
    # ~05:00 Europe/Riga — Mieram tuvu already rolled over; kids wake later.
    # Summer (EEST, UTC+3): 02:00 UTC · Winter (EET, UTC+2): 03:00 UTC.
    # Both fire; generation is idempotent per date (skips if already done).
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Secrets are injected as env vars — do not use `npm run generate:daily`
      # (that script loads `.env.local`, which does not exist on the runner).
      - name: Generate daily lessons
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODELS: ${{ secrets.AI_MODELS }}
          KID_SESSION_SECRET: ${{ secrets.KID_SESSION_SECRET }}
        run: npx tsx scripts/generate-daily.ts
