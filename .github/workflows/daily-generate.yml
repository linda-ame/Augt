name: Daily Augt generation

on:
  schedule:
    # ~00:10 Europe/Riga — shortly after Mieram tuvu midnight rollover.
    # Summer (EEST, UTC+3): 21:10 UTC · Winter (EET, UTC+2): 22:10 UTC.
    # Both fire; generation is idempotent per date (skips if already done).
    - cron: "10 21 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate daily lessons
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODELS: ${{ secrets.AI_MODELS }}
          KID_SESSION_SECRET: ${{ secrets.KID_SESSION_SECRET }}
        run: npm run generate:daily
