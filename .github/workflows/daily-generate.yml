name: Daily Augt generation

on:
  schedule:
    # TEST: ~10:15 Europe/Riga (07:15 UTC in summer).
    - cron: "15 7 * * *"
    # Steady: ~05:00 Europe/Riga.
    # Summer 02:00 UTC · Winter 03:00 UTC.
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Run on the deployed app (not the Actions runner). GitHub IPs often
      # timeout or get empty HTML from mieramtuvu.lv; the app host can fetch it.
      - name: Generate daily lessons via app cron
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing NEXT_PUBLIC_APP_URL or CRON_SECRET secret"
            exit 1
          fi
          echo "Calling ${APP_URL%/}/api/cron/generate-daily"
          curl -fsS -X POST \
            --max-time 600 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${APP_URL%/}/api/cron/generate-daily"
