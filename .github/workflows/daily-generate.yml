name: Daily Augt generation

on:
  schedule:
    # TEMP TEST: ~01:27 Europe/Riga (EEST = UTC+3 → 22:27 UTC). Revert after verifying.
    - cron: "27 22 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate daily lessons
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODELS: ${{ secrets.AI_MODELS }}
          KID_SESSION_SECRET: ${{ secrets.KID_SESSION_SECRET }}
        run: npm run generate:daily
