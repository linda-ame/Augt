name: Daily Augt generation

# Scheduled generation is handled by cron-job.org → POST /api/cron/generate-daily.
# This workflow remains for manual runs only.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate daily lessons via app cron
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing NEXT_PUBLIC_APP_URL or CRON_SECRET secret"
            exit 1
          fi
          echo "Calling ${APP_URL%/}/api/cron/generate-daily"
          curl -fsS -X POST \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${APP_URL%/}/api/cron/generate-daily"
