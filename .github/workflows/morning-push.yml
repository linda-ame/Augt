name: Morning push notifications

on:
  schedule:
    # ~09:00 Europe/Riga (winter 07:00 UTC / summer 06:00 UTC)
    # TODO: when school starts, move earlier if needed
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning push
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing NEXT_PUBLIC_APP_URL or CRON_SECRET secret"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/morning-push"
