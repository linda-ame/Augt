name: Morning push notifications

on:
  schedule:
    # ~09:00 Europe/Riga.
    # Summer (EEST, UTC+3): 06:00 UTC. Winter (EET, UTC+2): switch to "0 7 * * *".
    # (Only one cron — push is not idempotent; dual schedules would notify twice.)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning push
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing NEXT_PUBLIC_APP_URL or CRON_SECRET secret"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/morning-push"
