name: Morning push notifications

# Scheduled push is handled by cron-job.org → POST /api/cron/morning-push.
# Keep workflow_dispatch only (manual). Do not dual-schedule — push is not idempotent.
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning push
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing NEXT_PUBLIC_APP_URL or CRON_SECRET secret"
            exit 1
          fi
          curl -fsS -X POST \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/morning-push"
