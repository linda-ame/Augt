name: Morning push notifications

on:
  schedule:
    # TEMP TEST: ~13:45 Europe/Riga (EEST = UTC+3 → 10:45 UTC). Revert after verifying.
    - cron: "45 10 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning push
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing NEXT_PUBLIC_APP_URL or CRON_SECRET secret"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/morning-push"
